<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#073b2f">
  <title>MatMove Admin · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0%,#e2f7ef,transparent 40%),linear-gradient(145deg,#f4fafb,#edf5fb);font:14px system-ui,sans-serif;color:#132f48}.panel{width:min(100%,430px);padding:28px;border:1px solid rgba(255,255,255,.9);border-radius:24px;background:rgba(255,255,255,.82);box-shadow:0 18px 46px rgba(12,47,71,.09);backdrop-filter:blur(18px);text-align:center}.logo{width:52px;height:52px;object-fit:contain;border-radius:14px;background:#fff;padding:5px}.eyebrow{margin:18px 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#0e946b;font-weight:800}h1{font-size:21px;line-height:1.2;margin:0}p{line-height:1.6;color:#688096;font-size:13px}.hint{margin-top:18px;padding:12px;border-radius:12px;background:#edf7f3;color:#17634e;font-size:12px}
  </style>
</head>
<body>
  <main class="panel">
    <img class="logo" src="/logo.png" alt="MatMove">
    <p class="eyebrow">MatMove Administration</p>
    <h1>You're offline</h1>
    <p>The Admin app shell is saved on this device, but staff permissions and live information must be verified online before they can be shown.</p>
    <div class="hint">Reconnect to the internet, then reload this page.</div>
  </main>
</body>
</html>
