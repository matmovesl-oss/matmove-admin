name: MatMove Admin checks

on:
  pull_request:
    paths:
      - 'project/**'
      - '.github/workflows/matmove-admin-checks.yml'
  push:
    branches:
      - work/production-finance-hardening
    paths:
      - 'project/**'
      - '.github/workflows/matmove-admin-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run automated tests
        run: npm run test:finance
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
